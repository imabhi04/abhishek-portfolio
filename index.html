<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abhishek Maddheshiya — Data & ML Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet"/>

<style>
:root {
  --cream: #f5f0e8;
  --cream-dark: #ede6d6;
  --parchment: #faf7f2;
  --forest: #1a3a2a;
  --forest-mid: #2d5a3d;
  --forest-light: #3d7a52;
  --sage: #7aab8a;
  --gold: #c4922a;
  --gold-light: #e8b84b;
  --rust: #b84a2e;
  --ink: #1c1a16;
  --ink-mid: #4a4540;
  --ink-light: #7a7268;
  --white: #ffffff;
  --shadow: rgba(26, 58, 42, 0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  font-size: 15px;
  line-height: 1.75;
  cursor: none;
}

/* ── CUSTOM CURSOR ── */
.cursor {
  position: fixed;
  width: 10px; height: 10px;
  background: var(--forest);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transition: transform 0.15s ease;
  transform: translate(-50%, -50%);
}
.cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1.5px solid var(--forest-light);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transition: transform 0.35s ease, width 0.3s, height 0.3s, opacity 0.3s;
  transform: translate(-50%, -50%);
  opacity: 0.5;
}
body:hover .cursor { opacity: 1; }

/* ── PROGRESS BAR ── */
.progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--forest), var(--gold));
  z-index: 200;
  width: 0%;
  transition: width 0.1s;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 24px 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  mix-blend-mode: multiply;
}

.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--forest);
  letter-spacing: 0.04em;
}

.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}
.nav-links a {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mid);
  text-decoration: none;
  position: relative;
  transition: color 0.25s;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 0;
  width: 0; height: 1px;
  background: var(--forest);
  transition: width 0.3s ease;
}
.nav-links a:hover { color: var(--forest); }
.nav-links a:hover::after { width: 100%; }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  position: relative;
  overflow: hidden;
}

.hero-left {
  background: var(--forest);
  padding: 160px 80px 80px 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}

.hero-left::before {
  content: 'DATA';
  position: absolute;
  bottom: -40px; left: -20px;
  font-family: 'Playfair Display', serif;
  font-size: 200px;
  font-weight: 900;
  color: rgba(255,255,255,0.03);
  line-height: 1;
  pointer-events: none;
  user-select: none;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--sage);
  padding: 8px 18px;
  border-radius: 100px;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  width: fit-content;
  margin-bottom: 48px;
  opacity: 0;
  animation: slideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.3s;
}

.hero-tag::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--gold-light);
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.hero-name {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: clamp(52px, 5.5vw, 88px);
  line-height: 1.0;
  color: var(--cream);
  letter-spacing: -0.02em;
  opacity: 0;
  animation: slideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.5s;
}

.hero-name em {
  font-style: italic;
  color: var(--gold-light);
}

.hero-bottom {
  opacity: 0;
  animation: slideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.9s;
}

.hero-location {
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-location::before {
  content: '';
  width: 24px; height: 1px;
  background: rgba(255,255,255,0.25);
}

.hero-contact-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.hero-link {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  transition: color 0.2s;
}
.hero-link:hover { color: var(--gold-light); }

/* ── HERO RIGHT ── */
.hero-right {
  background: var(--cream);
  padding: 160px 80px 80px 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
}

.hero-right::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--sage), transparent);
  opacity: 0.4;
}

.hero-role {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 2.5vw, 32px);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mid);
  margin-bottom: 32px;
  opacity: 0;
  animation: slideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.7s;
}

.hero-role strong {
  font-style: normal;
  font-weight: 600;
  color: var(--forest);
}

.hero-bio {
  font-size: 15px;
  color: var(--ink-mid);
  line-height: 1.85;
  margin-bottom: 48px;
  max-width: 420px;
  opacity: 0;
  animation: slideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.9s;
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--cream-dark);
  border: 1px solid var(--cream-dark);
  border-radius: 8px;
  overflow: hidden;
  max-width: 400px;
  opacity: 0;
  animation: slideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards 1.1s;
}

.hero-stat {
  background: var(--cream);
  padding: 20px 16px;
  text-align: center;
}

.stat-n {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--forest);
  line-height: 1;
  margin-bottom: 4px;
}

.stat-l {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-light);
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── SECTION ── */
section {
  position: relative;
  padding: 120px 80px;
}

.section-inner { max-width: 1200px; margin: 0 auto; }

.section-eyebrow {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}

.eyebrow-line {
  width: 48px; height: 1px;
  background: var(--gold);
}

.eyebrow-text {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(36px, 4vw, 64px);
  font-weight: 700;
  line-height: 1.1;
  color: var(--forest);
  margin-bottom: 64px;
}

.section-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--ink-mid);
}

/* ── SKILLS ── */
.skills-section { background: var(--cream-dark); }

.skills-layout {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 80px;
  align-items: start;
}

.skills-intro {
  position: sticky;
  top: 120px;
}

.skills-desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  line-height: 1.6;
  color: var(--ink-mid);
  margin-bottom: 32px;
}

.skills-grid {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: rgba(26,58,42,0.1);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(26,58,42,0.1);
}

.skill-row {
  background: var(--parchment);
  padding: 28px 32px;
  display: grid;
  grid-template-columns: 200px 1fr auto;
  gap: 24px;
  align-items: center;
  transition: background 0.25s;
  cursor: default;
}

.skill-row:hover { background: var(--white); }

.skill-name {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--forest);
}

.skill-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  background: var(--cream-dark);
  border: 1px solid rgba(26,58,42,0.15);
  color: var(--ink-mid);
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  transition: all 0.2s;
}

.chip.green { background: rgba(26,58,42,0.08); border-color: rgba(26,58,42,0.2); color: var(--forest); }
.chip.gold { background: rgba(196,146,42,0.1); border-color: rgba(196,146,42,0.25); color: var(--gold); }

.skill-row:hover .chip { border-color: rgba(26,58,42,0.3); }

.skill-level {
  display: flex;
  gap: 3px;
}

.level-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--cream-dark);
  border: 1px solid rgba(26,58,42,0.2);
}

.level-dot.filled { background: var(--forest); border-color: var(--forest); }

/* ── EXPERIENCE ── */
.experience-section { background: var(--parchment); }

.exp-timeline {
  position: relative;
  padding-left: 40px;
}

.exp-timeline::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(to bottom, var(--forest), var(--sage), transparent);
}

.exp-block {
  position: relative;
  padding-bottom: 72px;
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.exp-block.visible { opacity: 1; transform: translateX(0); }
.exp-block:last-child { padding-bottom: 0; }

.exp-block::before {
  content: '';
  position: absolute;
  left: -44px; top: 8px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--parchment);
  box-shadow: 0 0 0 3px rgba(196,146,42,0.25);
}

.exp-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 24px;
}

.exp-title-group {}

.exp-role-name {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--forest);
  line-height: 1.2;
  margin-bottom: 6px;
}

.exp-company-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--gold);
  letter-spacing: 0.08em;
}

.exp-badge {
  background: var(--forest);
  color: var(--cream);
  padding: 8px 18px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.exp-desc {
  color: var(--ink-mid);
  font-size: 14px;
  line-height: 1.85;
  margin-bottom: 20px;
  max-width: 720px;
}

.exp-points {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 760px;
}

.exp-points li {
  display: flex;
  gap: 14px;
  color: var(--ink-mid);
  font-size: 14px;
  line-height: 1.7;
}

.exp-points li::before {
  content: '◆';
  color: var(--sage);
  font-size: 8px;
  margin-top: 5px;
  flex-shrink: 0;
}

/* ── PROJECTS ── */
.projects-section { background: var(--forest); }

.projects-section .section-title { color: var(--cream); }
.projects-section .eyebrow-text { color: var(--gold-light); }
.projects-section .eyebrow-line { background: var(--gold-light); }

.projects-bento {
  display: grid;
  grid-template-columns: 3fr 2fr;
  grid-template-rows: auto auto;
  gap: 2px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

.proj-card {
  background: rgba(255,255,255,0.04);
  padding: 52px 48px;
  transition: background 0.3s;
  position: relative;
  overflow: hidden;
}

.proj-card:hover { background: rgba(255,255,255,0.07); }

.proj-card.featured {
  grid-row: 1 / 2;
}

.proj-card.side {
  border-left: 2px solid rgba(255,255,255,0.06);
}

.proj-card.bottom {
  grid-column: 1 / 3;
  border-top: 2px solid rgba(255,255,255,0.06);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
}

.proj-number {
  font-family: 'Playfair Display', serif;
  font-size: 72px;
  font-weight: 900;
  color: rgba(255,255,255,0.06);
  line-height: 1;
  position: absolute;
  top: 20px; right: 32px;
}

.proj-tag {
  display: inline-block;
  background: rgba(196,146,42,0.2);
  border: 1px solid rgba(196,146,42,0.3);
  color: var(--gold-light);
  padding: 5px 14px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.proj-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.2;
  margin-bottom: 16px;
}

.proj-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  line-height: 1.8;
  margin-bottom: 28px;
}

.proj-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.proj-chip {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.6);
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 400;
}

/* ── EDUCATION ── */
.education-section { background: var(--cream); }

.edu-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
}

.edu-main-card {
  background: var(--forest);
  color: var(--cream);
  border-radius: 16px;
  padding: 52px;
  position: relative;
  overflow: hidden;
}

.edu-main-card::before {
  content: 'BCA';
  position: absolute;
  bottom: -30px; right: -10px;
  font-family: 'Playfair Display', serif;
  font-size: 140px;
  font-weight: 900;
  color: rgba(255,255,255,0.04);
  line-height: 1;
  pointer-events: none;
}

.edu-tag-small {
  display: inline-block;
  background: rgba(232,184,75,0.2);
  border: 1px solid rgba(232,184,75,0.3);
  color: var(--gold-light);
  padding: 5px 14px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.edu-degree-name {
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 12px;
  color: var(--cream);
}

.edu-spec {
  font-size: 13px;
  color: var(--sage);
  margin-bottom: 20px;
  font-weight: 500;
  letter-spacing: 0.06em;
}

.edu-uni-name {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  line-height: 1.6;
}

.edu-year-badge {
  display: inline-block;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--cream);
  padding: 6px 18px;
  border-radius: 100px;
  font-size: 12px;
  margin-top: 24px;
}

.certs-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cert-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: var(--parchment);
  border: 1px solid var(--cream-dark);
  border-radius: 10px;
  transition: border-color 0.2s, transform 0.2s;
}

.cert-row:hover {
  border-color: var(--sage);
  transform: translateX(4px);
}

.cert-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--forest);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.cert-info { flex: 1; }

.cert-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}

.cert-org {
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 0.06em;
  margin-top: 2px;
}

.cert-year {
  font-size: 10px;
  color: var(--ink-light);
  font-weight: 500;
}

/* ── CONTACT ── */
.contact-section {
  background: var(--cream-dark);
  padding: 120px 80px;
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto;
}

.contact-headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(40px, 5vw, 72px);
  font-weight: 900;
  line-height: 1.0;
  color: var(--forest);
  letter-spacing: -0.02em;
}

.contact-headline em {
  font-style: italic;
  font-weight: 400;
  color: var(--ink-light);
}

.contact-right {}

.contact-sub {
  font-size: 15px;
  color: var(--ink-mid);
  line-height: 1.8;
  margin-bottom: 40px;
}

.contact-items {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: var(--ink);
  padding: 16px 24px;
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--cream-dark);
  transition: all 0.25s;
}

.contact-item:hover {
  border-color: var(--forest);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px var(--shadow);
}

.contact-item-icon {
  width: 40px; height: 40px;
  background: var(--forest);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.contact-item-text { flex: 1; }
.contact-item-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 2px;
}
.contact-item-value {
  font-size: 13px;
  font-weight: 500;
  color: var(--forest);
}

.contact-item-arrow {
  font-size: 18px;
  color: var(--ink-light);
  transition: transform 0.2s, color 0.2s;
}

.contact-item:hover .contact-item-arrow {
  transform: translateX(4px);
  color: var(--forest);
}

/* ── FOOTER ── */
footer {
  background: var(--forest);
  padding: 32px 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--cream);
  letter-spacing: 0.04em;
}

.footer-copy {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.12em;
}

.footer-links {
  display: flex;
  gap: 24px;
}
.footer-links a {
